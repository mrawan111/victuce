spring.application.name=victus-store

# ? PostgreSQL Database Connection
# Uses environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Default connection assumes the DB is running as a Docker service named "db" on the same Docker network.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ? HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1


# ⭐ Cloudinary Configuration (must be provided via env in production)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ⭐ File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ?? Hibernate / JPA Settings (production-safe)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ? Logging Configuration (production)
logging.level.root=INFO
logging.level.com.victusstore=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ? Server Port
server.port=8080
server.address=0.0.0.0

# ? CORS Configuration
# Comma-separated list of allowed origins for API requests.
# Includes production domains (main, www, admin) and common local dev ports for the React/Vite frontend.
app.cors.allowed-origins=https://victusstore.store,https://www.victusstore.store,https://admin.victusstore.store,http://localhost:5173,http://localhost:3000
app.cors.allow-credentials=true

# ? JWT Configuration
# Must be set via environment variable APP_JWT_SECRET or property app.jwt.secret in production.
app.jwt.secret=${APP_JWT_SECRET:}

# Resend email configuration
# Replace re_xxxxxxxxx with your real API key, preferably via RESEND_API_KEY environment variable.
app.resend.api-key=${RESEND_API_KEY:re_WWAajV9V_9dUHS2ggT2ANV6gqJyFQ5GjT}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# ? SEO / Sitemap - Base URL for sitemaps and robots.txt (no trailing slash)
# Used for generating absolute URLs in sitemaps. Set via APP_STORE_BASE_URL in production.
app.store.base-url=${APP_STORE_BASE_URL:https://victusstore.store}

# ⭐ GeoDB Cities API Configuration
# Get your API key from: https://rapidapi.com/wirefreethought/api/geodb-cities
geodb.api.key=${GEODB_API_KEY:2fc6fcb0aamsh33cc040533891f0p1819c1jsncf4d7fff672b}


# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../database
spring.flyway.baseline-on-migrate=true
